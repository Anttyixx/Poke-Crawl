# Publishes two builds of the game to GitHub Pages as one site:
#   main -> https://<user>.github.io/<repo>/       (stable)
#   dev  -> https://<user>.github.io/<repo>/dev/   (experimental)
# A push to either branch rebuilds and redeploys both.
#
# The github-pages environment only accepts deploys from main by default, so a
# push to dev does not deploy itself: the `relay` job re-runs this workflow on
# main, and that run builds both branches.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        id: dev
        continue-on-error: true   # dev may not exist; stable still deploys
        with:
          ref: dev
          path: dev-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build stable (main)
        run: |
          python stable/build.py
          mkdir -p site
          cp -r stable/dist/. site/
      - name: Build experimental (dev)
        if: steps.dev.outcome == 'success'
        run: |
          if python dev-src/build.py; then
            mkdir -p site/dev
            cp -r dev-src/dist/. site/dev/
            sed -i 's|<title>Poke-Crawl</title>|<title>Poke-Crawl (dev)</title>|' site/dev/index.html
          else
            echo "::warning::dev failed to build; only the stable game was deployed"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
