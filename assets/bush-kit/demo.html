<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bush Kit demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1d3328; --moss: #2f5a40; --leaf: #b9f27c; --paper: #f7f9f2; --ink: #1a2420; --line: #3e6b8a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --forest: #2a4a39; } }
  :root[data-theme="dark"] { --forest: #1d3328; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--forest); color: var(--paper);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-family: "Pixelify Sans", system-ui, sans-serif; font-weight: 600; font-size: 28px; line-height: 1.1; margin: 0 0 4px; }
  .sub { margin: 0 0 16px; opacity: .8; max-width: 60ch; }
  .stage { position: relative; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 4px var(--moss); }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
  .box {
    position: absolute; left: 8px; right: 8px; bottom: 8px;
    background: var(--paper); color: var(--ink);
    border: 4px solid var(--line); border-radius: 8px; box-shadow: inset 0 0 0 3px #fff, 0 3px 0 rgba(0,0,0,.25);
    font-family: "Pixelify Sans", system-ui, sans-serif; font-size: clamp(15px, 3.6vw, 20px); line-height: 1.3;
    padding: 10px 14px; min-height: 2.6em;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  button {
    font: 600 16px "Pixelify Sans", system-ui, sans-serif; color: var(--ink);
    background: var(--leaf); border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer;
    box-shadow: 0 3px 0 #6fa83f;
  }
  button.alt { background: var(--paper); box-shadow: 0 3px 0 #a9b8a0; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6fa83f; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .legend { margin: 14px 0 0; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>Shaking grass</h1>
  <p class="sub">One patch has a Pokémon hiding in it. Tap the bush that keeps shaking.</p>
  <div class="stage">
    <canvas id="field" width="960" height="672" aria-label="Field of grass"></canvas>
    <div class="box" id="msg" role="status">Something is moving in the grass…</div>
  </div>
  <div class="controls">
    <button id="radar">Use Poké Radar</button>
    <button id="hide" class="alt">Hide a new Pokémon</button>
  </div>
  <p class="legend">The Radar shakes three patches: a normal rustle, a vigorous one, and a shiny one that glows.</p>
</main>

<script src="bush-kit.js"></script>
<script>
(async function () {
  const kit = await BushKit.load();
  const T = kit.TILE, COLS = 10, ROWS = 7, SCALE = 3;
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const say = (t) => { msg.textContent = t; };

  // A rough patch of grass in the middle of the field (rows 4-6 stay clear for the text box)
  const patch = [
    '..........',
    '..######..',
    '.########.',
    '.#######..',
    '..........',
    '..........',
    '..........'
  ];
  const bushes = [];
  patch.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '#') bushes.push(kit.createBush(c * T, r * T));
  }));

  let hidden = null;
  function hide() {
    if (hidden) hidden.stop();
    hidden = bushes[Math.floor(Math.random() * bushes.length)];
    hidden.shake('vigorous', { loop: true, gapMs: 900 });
    say('Something is moving in the grass…');
  }

  canvas.addEventListener('click', (e) => {
    const r = canvas.getBoundingClientRect();
    const gx = (e.clientX - r.left) / r.width * COLS * T;
    const gy = (e.clientY - r.top) / r.height * ROWS * T;
    const b = kit.bushAt(gx, gy);
    if (!b) return;
    if (b === hidden) {
      hidden.stop(); hidden = null;
      b.shake('shiny');
      say('A wild Pokémon appeared!');
    } else {
      b.shake('normal');
      say('Just the wind…');
    }
  });

  document.getElementById('radar').addEventListener('click', () => {
    const pool = bushes.filter(b => b !== hidden).sort(() => Math.random() - .5);
    ['normal', 'vigorous', 'shiny'].forEach((type, i) => setTimeout(() => pool[i].shake(type), i * 250));
    say('The grass is rustling in three places!');
  });
  document.getElementById('hide').addEventListener('click', hide);

  let last = performance.now();
  function frame(now) {
    kit.update(Math.min(100, now - last)); last = now;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) kit.drawGround(ctx, c * T, r * T, { scale: SCALE });
    for (const b of bushes) b.drawBase(ctx, { scale: SCALE });
    for (const b of bushes) b.drawLeaves(ctx, { scale: SCALE }); // leaves on top of neighbouring bushes
    requestAnimationFrame(frame);
  }
  hide();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
